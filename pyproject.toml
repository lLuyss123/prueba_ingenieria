[project]
name = "airflow2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LuisMejia", email = "lmejiaidep@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "datamart"
module-root = "src"
